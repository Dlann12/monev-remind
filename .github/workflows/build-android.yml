name: Build Android APK (Capacitor)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Vue + Vite production bundle
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK for Release & Artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MagangHub-Reminder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maganghub-reminder-debug-apk
          path: MagangHub-Reminder.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Build Android APK otomatis (commit \`${SHORT_SHA}\`). Langsung unduh **MagangHub-Reminder.apk** di bawah ini untuk dipasang pada perangkat Android 8.0+."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MagangHub-Reminder.apk --clobber
            gh release edit "$TAG" --target "${GITHUB_SHA}" --title "MagangHub Reminder ${TAG}" --notes "$NOTES" --latest
          else
            gh release create "$TAG" MagangHub-Reminder.apk \
              --target "${GITHUB_SHA}" \
              --title "MagangHub Reminder ${TAG}" \
              --notes "$NOTES" \
              --latest
          fi
